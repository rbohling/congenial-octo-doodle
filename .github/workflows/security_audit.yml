name: Security Audit

on:
  pull_request:
    branches:
      - main
      - master
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  secret-scan:
    name: Detect hardcoded secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  insecure-url-scan:
    name: Block insecure HTTP URLs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Scan for insecure URLs in source files
        shell: bash
        run: |
          set -euo pipefail

          # Search source files for plain HTTP links that are not local development URLs.
          MATCHES=$(grep -RInE "http://[[:alnum:]._-]+" \
            --include="*.html" \
            --include="*.js" \
            --include="*.ts" \
            --include="*.jsx" \
            --include="*.tsx" \
            --include="*.css" \
            --include="*.json" \
            --exclude-dir=.git \
            --exclude-dir=node_modules \
            . || true)

          FILTERED=$(echo "$MATCHES" | grep -Ev "http://(localhost|127\\.0\\.0\\.1)" || true)

          if [ -n "$FILTERED" ]; then
            echo "Found insecure HTTP URLs in source files:"
            echo "$FILTERED"
            exit 1
          fi

          echo "No insecure non-local HTTP URLs found."

  deploy:
    name: Deployment gate
    runs-on: ubuntu-latest
    needs:
      - secret-scan
      - insecure-url-scan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Ready to deploy
        run: echo "All security checks passed. Safe to run deployment steps."
